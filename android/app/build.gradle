plugins {
    id 'com.android.application'
}

def quasarAssets = layout.buildDirectory.dir('generated/quasar/assets').get().asFile

android {
    namespace = 'com.ultirisstudio.quasar.sandbox'
    compileSdk = 35
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'com.ultirisstudio.quasar.sandbox'
        minSdk = 33
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DQUASAR_WARNINGS_AS_ERRORS=OFF'
                targets 'QuasarSandbox'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path = file('../../CMakeLists.txt')
            version = '3.31.6'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['../../external/SDL/android-project/app/src/main/java']
            res.srcDirs = ['../../external/SDL/android-project/app/src/main/res']
            assets.srcDirs = [quasarAssets]
        }
    }
}

tasks.register('copyQuasarResources', Copy) {
    from '../../engine/resources'
    into new File(quasarAssets, 'resources')
}

tasks.named('preBuild') {
    dependsOn 'copyQuasarResources'
}
