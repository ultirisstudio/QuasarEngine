name: Static analysis

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # A pull request is checked out as its merge commit, whose first parent is the base branch
          fetch-depth: 2

      # clang-tidy and clang-scan-deps, plus what CMake needs to configure the project: build tools and the development
      # packages of SDL3 (X11, Wayland, udev and D-Bus) and OpenGL
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-18 clang-tools-18 ninja-build pkg-config \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxext-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev \
            libudev-dev libdbus-1-dev \
            libgl1-mesa-dev

      - name: Show tool versions
        run: |
          cmake --version
          clang-tidy-18 --version

      # Configuring is enough: it writes compile_commands.json, which tells clang-tidy how each file is compiled
      - name: Configure
        run: cmake --preset linux-clang-debug

      # A pull request only checks the source files that it changes or whose included files it changes. Master checks
      # every source file.
      - name: Find the files to check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 .github/scripts/affected_translation_units.py --build build/linux-clang-debug --base HEAD^1 \
              > clang-tidy-files.txt
          else
            echo '/(engine|sandbox|editor|tests)/src/' > clang-tidy-files.txt
          fi

      # Each problem is also shown on its line in the pull request
      - name: Run clang-tidy
        run: |
          mapfile -t files < clang-tidy-files.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No source file is affected by the changes"
            exit 0
          fi
          run-clang-tidy-18 -clang-tidy-binary clang-tidy-18 -p build/linux-clang-debug -quiet -j "$(nproc)" \
            "${files[@]}" | tee clang-tidy.log
          status=${PIPESTATUS[0]}
          grep -E '^/[^ ]+:[0-9]+:[0-9]+: (warning|error): ' clang-tidy.log | sort -u \
            | sed -E -e "s#^$GITHUB_WORKSPACE/##" \
                -e "s#^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)#::error file=\1,line=\2,col=\3::\4#" \
                -e "s#,-warnings-as-errors\]#]#" \
            || true
          exit "$status"
