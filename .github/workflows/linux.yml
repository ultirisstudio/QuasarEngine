name: Linux

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Linux ${{ matrix.compiler }} (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            config: Debug
            preset: linux-gcc-debug
          - compiler: GCC
            config: Release
            preset: linux-gcc-release
          - compiler: Clang
            config: Debug
            preset: linux-clang-debug
          - compiler: Clang
            config: Release
            preset: linux-clang-release
          - compiler: GCC
            config: ASan + UBSan
            preset: linux-gcc-asan
            sanitizers: true
          - compiler: GCC
            config: TSan + UBSan
            preset: linux-gcc-tsan
            sanitizers: true
          - compiler: Clang
            config: ASan + UBSan
            preset: linux-clang-asan
            sanitizers: true
          - compiler: Clang
            config: TSan + UBSan
            preset: linux-clang-tsan
            sanitizers: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute the cache key
        id: cache-key
        run: |
          hash=$(git ls-files -s -- external CMakeLists.txt CMakePresets.json cmake | git hash-object --stdin)
          echo "key=build-${{ matrix.preset }}-$ImageOS-$ImageVersion-$hash" >> "$GITHUB_OUTPUT"

      - name: Reset third-party timestamps
        run: find external -type f -exec touch -d '2000-01-01 00:00:00' {} +

      - name: Cache the build folder
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}
          key: ${{ steps.cache-key.outputs.key }}

      # Build tools, the runtime libraries of the Clang sanitizers, the development packages needed by SDL3 (X11,
      # Wayland, udev and D-Bus), OpenGL and nativefiledialog-extended (GTK3), plus an X server without a screen and the
      # Mesa software driver, which give the tests real windows and a real OpenGL 4.5 context
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libclang-rt-18-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxext-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev \
            libudev-dev libdbus-1-dev \
            libgl1-mesa-dev libglx-mesa0 libgl1-mesa-dri xvfb \
            libgtk-3-dev

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          gcc --version
          clang --version

      # The sanitizers of GCC 13 and Clang 18 do not support the address randomization of recent Linux kernels
      - name: Reduce the address randomization for the sanitizers
        if: matrix.sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The tests use the X11 driver of SDL, so they run in a virtual X server
      - name: Test
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}
