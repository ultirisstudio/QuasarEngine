name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOXYGEN_VERSION: 1.18.0
  GCOVR_VERSION: 8.8

jobs:
  check:
    name: Check documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the documentation theme
        run: git submodule update --init --depth 1 external/doxygen-awesome-css

      - name: Install Doxygen
        run: |
          url="https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}"
          curl -fsSL "$url/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin" >> "$GITHUB_PATH"

      # Doxygen only checks macros in files that have a \file comment
      - name: Check that every public header has a file comment
        run: |
          missing=0
          for header in $(git ls-files 'engine/include/*.h'); do
            if ! grep -q '^/// \\file' "$header"; then
              echo "::error file=$header,line=1::This header has no '/// \\file' comment"
              missing=1
            fi
          done
          exit $missing

      # The warning format is changed so that GitHub shows each problem on the line of the pull request
      - name: Generate the documentation
        run: |
          mkdir -p build
          doxygen --version
          { cat docs/Doxyfile; echo 'WARN_FORMAT = "::error file=$file,line=$line::$text"'; } | doxygen -

      # Small JSON files read by the shields.io badges of the README
      - name: Compute the code statistics
        run: |
          mkdir -p build/docs/html/badges
          badge() {
            printf '{"schemaVersion": 1, "label": "%s", "message": "%s", "color": "blue"}\n' "$2" "$3" \
              > "build/docs/html/badges/$1.json"
          }

          files=$(git ls-files -- engine editor sandbox tests | grep -E '\.(h|cpp)$')
          headers=$(grep -c '\.h$' <<< "$files" || true)
          sources=$(grep -c '\.cpp$' <<< "$files" || true)
          lines=$(xargs cat <<< "$files" | grep -cv '^[[:space:]]*$' || true)
          tests=$(git grep -h 'TEST_CASE(' -- tests | wc -l || true)

          badge headers "header files" "$headers"
          badge sources "source files" "$sources"
          badge lines "lines of code" "$lines"
          badge tests "unit tests" "$tests"
          cat build/docs/html/badges/*.json

      - name: Upload the documentation
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/html

  coverage:
    name: Measure the test coverage
    runs-on: ubuntu-24.04
    env:
      PRESET: linux-gcc-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute the cache key
        id: cache-key
        run: |
          hash=$(git ls-files -s -- external CMakeLists.txt CMakePresets.json cmake | git hash-object --stdin)
          echo "key=build-$PRESET-$ImageOS-$ImageVersion-$hash" >> "$GITHUB_OUTPUT"

      - name: Reset third-party timestamps
        run: find external -type f -exec touch -d '2000-01-01 00:00:00' {} +

      - name: Cache the build folder
        uses: actions/cache@v6
        with:
          path: build/${{ env.PRESET }}
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build pkg-config \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxext-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev \
            libudev-dev libdbus-1-dev \
            libgl1-mesa-dev libglx-mesa0 libgl1-mesa-dri xvfb \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          pipx install gcovr==$GCOVR_VERSION
          gcovr --version

      - name: Configure
        run: cmake --preset $PRESET

      - name: Build
        run: cmake --build --preset $PRESET

      - name: Remove the files of the previous run
        run: |
          ninja -C build/$PRESET -t cleandead
          find build/$PRESET -name '*.gcno' -exec sh -c 'for file; do [ -e "${file%.gcno}.o" ] || rm "$file"; done' sh {} +
          find build/$PRESET -name '*.gcda' -delete

      - name: Test
        run: xvfb-run -a ctest --preset $PRESET

      - name: Generate the coverage report
        run: |
          mkdir -p build/coverage/coverage build/coverage/badges
          gcovr --html-nested build/coverage/coverage/index.html --html-title "QuasarEngine coverage" \
            --json-summary build/coverage/summary.json --print-summary

      - name: Compute the coverage badges
        shell: python
        run: |
          import json
          import os

          summary = json.load(open("build/coverage/summary.json"))
          table = ["| Coverage | Covered | Total | Percent |", "|---|---|---|---|"]
          for kind, label in (("line", "lines"), ("function", "functions"), ("condition", "conditions")):
              percent = summary[f"{kind}_percent"]
              color = "brightgreen" if percent >= 90 else "yellow" if percent >= 75 else "red"
              badge = {"schemaVersion": 1, "label": f"{kind} coverage", "message": f"{percent:.1f}%", "color": color}
              with open(f"build/coverage/badges/coverage-{label}.json", "w") as file:
                  json.dump(badge, file)
              table.append(f"| {label.capitalize()} | {summary[f'{kind}_covered']} | {summary[f'{kind}_total']} | {percent:.1f}% |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write("\n".join(table) + "\n\nThe detailed report is in the coverage artifact of this run.\n")
          print("\n".join(table))

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            build/coverage/coverage
            build/coverage/badges

  # The site gathers the documentation, its badges, the coverage report and the coverage badges
  publish:
    name: Publish documentation
    if: github.ref == 'refs/heads/master'
    needs: [check, coverage]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: site

      - name: Download the coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
