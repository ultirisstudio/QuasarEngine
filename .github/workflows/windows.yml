name: Windows

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows MSVC (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-debug
          - config: Release
            preset: windows-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Compute the cache key
        id: cache-key
        shell: bash
        run: |
          hash=$(git ls-files -s -- external CMakeLists.txt CMakePresets.json cmake | git hash-object --stdin)
          echo "key=build-${{ matrix.preset }}-$ImageOS-$ImageVersion-$hash" >> "$GITHUB_OUTPUT"

      - name: Reset third-party timestamps
        shell: bash
        run: find external -type f -exec touch -d '2000-01-01 00:00:00' {} +

      - name: Cache the build folder
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}
          key: ${{ steps.cache-key.outputs.key }}

      - name: Show tool versions
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
