name: Windows

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows MSVC (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
#          - config: Debug
#            preset: windows-debug
          - config: Release
            preset: windows-release
          - config: ASan
            preset: windows-asan

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute the cache key
        id: cache-key
        shell: bash
        run: |
          hash=$(git ls-files -s -- external CMakeLists.txt CMakePresets.json cmake | git hash-object --stdin)
          echo "key=build-${{ matrix.preset }}-$ImageOS-$ImageVersion-$hash" >> "$GITHUB_OUTPUT"

      - name: Reset third-party timestamps
        shell: bash
        run: find external -type f -exec touch -d '2000-01-01 00:00:00' {} +

      - name: Cache the build folder
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}
          key: ${{ steps.cache-key.outputs.key }}

      # The SDK gives the Vulkan headers and loader library, found by CMake through the VULKAN_SDK environment variable
      # that the action sets, and the Vulkan runtime that the tests load
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: Show tool versions
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Cache the Mesa software OpenGL and Vulkan drivers
        id: mesa-cache
        uses: actions/cache@v6
        with:
          path: mesa
          key: mesa-dist-win-26.0.3-release-msvc-x64-lavapipe

      - name: Download the Mesa software OpenGL and Vulkan drivers
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = '26.0.3'
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa-archive -y | Out-Null
          New-Item -ItemType Directory -Force mesa | Out-Null
          Copy-Item mesa-archive/x64/*.dll mesa/
          Copy-Item mesa-archive/x64/*.json mesa/
          if (-not (Test-Path mesa/opengl32.dll)) { throw "opengl32.dll is not in the x64 folder of the Mesa archive" }
          if (-not (Get-ChildItem mesa -Filter 'lvp_icd*.json')) { throw "Lavapipe is not in the x64 folder of the Mesa archive" }

      # The Vulkan loader reads VK_DRIVER_FILES to use Lavapipe, the Mesa software Vulkan driver, as the only driver
      - name: Copy the Mesa software drivers and the Vulkan runtime next to the tests
        shell: pwsh
        run: |
          $loader = Get-ChildItem $env:VULKAN_SDK, C:\VulkanSDK -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
            Sort-Object { $_.FullName -notmatch 'x64' } | Select-Object -First 1
          if (-not $loader) { throw "vulkan-1.dll is not in the Vulkan SDK" }
          Get-ChildItem build/${{ matrix.preset }}/bin -Directory | ForEach-Object {
            Copy-Item mesa/*.dll $_.FullName
            Copy-Item $loader.FullName $_.FullName
          }
          $driver = Get-ChildItem mesa -Filter 'lvp_icd*.json' | Select-Object -First 1
          "VK_DRIVER_FILES=$($driver.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem mesa -Name
          $loader.FullName

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          GALLIUM_DRIVER: llvmpipe
