name: Windows

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows MSVC (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-debug
          - config: Release
            preset: windows-release
          - config: ASan
            preset: windows-asan

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute the cache key
        id: cache-key
        shell: bash
        run: |
          hash=$(git ls-files -s -- external CMakeLists.txt CMakePresets.json cmake | git hash-object --stdin)
          echo "key=build-${{ matrix.preset }}-$ImageOS-$ImageVersion-$hash" >> "$GITHUB_OUTPUT"

      - name: Reset third-party timestamps
        shell: bash
        run: find external -type f -exec touch -d '2000-01-01 00:00:00' {} +

      - name: Cache the build folder
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}
          key: ${{ steps.cache-key.outputs.key }}

      - name: Show tool versions
        run: cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Cache the Mesa software OpenGL driver
        id: mesa-cache
        uses: actions/cache@v6
        with:
          path: mesa
          key: mesa-dist-win-26.0.3-release-msvc-x64

      - name: Download the Mesa software OpenGL driver
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = '26.0.3'
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa-archive -y | Out-Null
          New-Item -ItemType Directory -Force mesa | Out-Null
          Copy-Item mesa-archive/x64/*.dll mesa/
          if (-not (Test-Path mesa/opengl32.dll)) { throw "opengl32.dll is not in the x64 folder of the Mesa archive" }

      - name: Copy the Mesa software OpenGL driver next to the tests
        shell: pwsh
        run: |
          Get-ChildItem build/${{ matrix.preset }}/bin -Directory | ForEach-Object { Copy-Item mesa/*.dll $_.FullName }
          Get-ChildItem mesa -Name

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          GALLIUM_DRIVER: llvmpipe
