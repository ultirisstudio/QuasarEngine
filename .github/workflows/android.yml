name: Android

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Android APK (Debug)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The SDK platform, the NDK and CMake in the versions that android/app/build.gradle asks for
      - name: Install the Android packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-35" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: QuasarSandbox-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
